# ----------------------------------------------------------------------
# Registry-tracked CodeCollections.
#
# Optional fields:
#   visibility    - 'public' (default) or 'hidden'. Hidden CCs are still
#                   synced and their image tags tracked for PAPI, but they
#                   are excluded from public-facing endpoints (website,
#                   MCP, AI search). 'hidden' is a UX toggle; OCI registry
#                   ACLs remain the source of truth for image access.
#   image_source  - which ImageSource plugin to drive ('oci' | 'static'
#                   | custom). Omit to skip image tracking entirely.
#   image_registry - OCI repo path used by the 'oci' source.
#   default_ref   - branch the 'latest' pointer should follow (default 'main').
#   plugin_path   - path to the V13 plugin inside the repository
#                   (e.g. 'plugins/kubernetes'). V13 plugins live in one
#                   monorepo and are parsed as skills (SKILL.md + tasks.yaml)
#                   instead of legacy Robot Framework codebundles.
# ----------------------------------------------------------------------
codecollections:
  - name: RunWhen Kubernetes Plugin
    slug: kubernetes
    git_url: https://github.com/runwhen-contrib/runwhen-plugins
    git_ref: v13/plugins-m4
    plugin_path: plugins/kubernetes
    owner: RunWhen
    owner_icon: https://assets-global.website-files.com/64f9646ad0f39e9ee5c116c4/659f80c7391d64a0ec2a840e_icon_rw-platform.svg
    owner_email: shea.stewart@runwhen.com
    description: Kubernetes integration and diagnostic/remediation skills
    image_source: oci
    image_registry: ghcr.io/runwhen-contrib/runwhen-plugins-runtime-kubernetes
